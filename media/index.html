<script>
// Swap each button for its player only when asked: a third-party frame sets
// cookies, and the footer promises none until the visitor chooses.
document.querySelectorAll(".media button.load").forEach(function (button) {
	button.addEventListener("click", function () {
		var frame = document.createElement("iframe");
		frame.src = button.dataset.src;
		frame.title = button.dataset.title;
		frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
		frame.allowFullscreen = true;
		button.replaceWith(frame);
		frame.focus();
	});
});
</script>
