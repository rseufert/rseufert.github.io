name: Rick Seufert
# Read by jekyll-seo-tag for every page's title, description, canonical URL,
# Open Graph and Twitter tags; jekyll-sitemap writes /sitemap.xml. Both are on
# GitHub Pages' list of supported plugins.
title: Rick Seufert
tagline: Mock SAP, EDI, bank and e-invoicing systems, and Flipper apps
description: >-
  Rick Seufert's projects: mock-sap, mock-edi, mock-bank and mock-einvoice,
  mock enterprise systems for testing SAP, EDI, payment and e-invoicing
  integrations without a license, a VPN or a trading partner. Also apps for the Flipper Zero, and a blog.
author: Rick Seufert
lang: en
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      # The share image when a page names none: an 800x450 film still.
      image: /blog/sap_invoices.png
markdown: kramdown
permalink: /blog/:year/:month/:day/:title
url: https://rickseufert.com
# Repo tooling, not site content. Setting exclude replaces Jekyll's default
# list (Gemfile, node_modules, vendor...), none of which this repo has.
exclude: [README.md, tools]
