name: sky data

# The dashboard's asteroid and fireball charts read sky.json, because NASA
# JPL's API does not answer a browser on another site. This saves a fresh
# copy every night. master is protected (its required checks never run on a
# bot's push), so the copy goes to its own branch, sky-data, which holds only
# sky.json; the page reads it from raw.githubusercontent.com.
on:
  schedule:
    - cron: "17 11 * * *"   # 04:17 in Portland (PDT), after JPL's nightly updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sky-data
  cancel-in-progress: false

jobs:
  fetch:
    name: save JPL close approaches and fireballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/sky_data.py --out "$RUNNER_TEMP/sky.json"
      - name: commit to sky-data if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898338+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin sky-data; then
            git worktree add -B sky-data "$RUNNER_TEMP/branch" FETCH_HEAD
          else
            git worktree add --orphan -b sky-data "$RUNNER_TEMP/branch"
          fi
          cp "$RUNNER_TEMP/sky.json" "$RUNNER_TEMP/branch/sky.json"
          cd "$RUNNER_TEMP/branch"
          git add sky.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Refresh dashboard sky data"
          git push origin sky-data
