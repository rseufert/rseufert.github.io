name: examples

on:
  push:
    branches: [master]
  pull_request:
  # The copies can go stale without anything happening here, because the
  # drift comes from the other repos.  Check daily as well as on push.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copies:
    name: example copies match their repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_examples.py
