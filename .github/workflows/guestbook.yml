name: guest book

# Whoever escapes rickbot's dungeon can sign the guest book, which is an
# issue on this repo titled "guestbook: NAME" (chat/chat.js opens it,
# prefilled). This compiles the open ones into guestbook.json whenever an
# issue changes, and commits it to the sky-data branch beside sky.json,
# since master is protected; the chat reads it from raw.githubusercontent.com
# (tools/guestbook.py). Closing an issue takes its entry out.
on:
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: "47 11 * * *"   # once a day too, in case an event is missed
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: sky-data            # the sky workflow pushes the same branch
  cancel-in-progress: false

jobs:
  compile:
    name: compile the guest book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/guestbook.py --out "$RUNNER_TEMP/guestbook.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit to sky-data if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898338+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin sky-data; then
            git worktree add -B sky-data "$RUNNER_TEMP/branch" FETCH_HEAD
          else
            git worktree add --orphan -b sky-data "$RUNNER_TEMP/branch"
          fi
          cp "$RUNNER_TEMP/guestbook.json" "$RUNNER_TEMP/branch/guestbook.json"
          cd "$RUNNER_TEMP/branch"
          git add guestbook.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Refresh the guest book"
          git push origin sky-data
